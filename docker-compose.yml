services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wind
      POSTGRES_PASSWORD: wind
      POSTGRES_DB: wind_dashboard
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
